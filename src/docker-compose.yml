services:
  web:
    build: .
    ports:
      - "5000:5000"
    privileged: true
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/spidev0.0:/dev/spidev0.0
      - /dev/spidev0.1:/dev/spidev0.1
    volumes:
      - /sys:/sys
    environment:
      - FLASK_ENV=production
    restart:
      unless-stopped